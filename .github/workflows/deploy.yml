name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build (produção)
        run: npx ng build --configuration production --base-href /pokedex_2026/

      # Fallback para rotas do Angular (ex.: /pokedex_2026/pokemon/pikachu ao recarregar a página)
      - name: Criar 404.html
        run: cp dist/pokedex_2026/browser/index.html dist/pokedex_2026/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pokedex_2026/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
